version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///learning_coach.db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
